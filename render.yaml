services:
  - type: web
    name: roaroic-caption-bot
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - {key: API_ID, sync: false}
      - {key: API_HASH, sync: false}
      - {key: BOT_TOKEN, sync: false}
      - {key: OWNER_ID, sync: false}
      - {key: SOURCE_CHANNELS, sync: false}
