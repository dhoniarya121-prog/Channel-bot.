services:
  - type: web
    name: roaroic-caption-bot
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    # Persistent disk: keeps the settings you make from the bot menu across redeploys.
    disk:
      name: roaroic-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_FILE
        value: /var/data/settings.json
      - key: PUBLIC_MODE
        value: "true"
      - key: MAX_CHANNELS_PER_USER
        value: "10"
      - {key: API_ID, sync: false}
      - {key: API_HASH, sync: false}
      - {key: BOT_TOKEN, sync: false}
      - {key: OWNER_ID, sync: false}
      - {key: SOURCE_CHANNELS, sync: false}
